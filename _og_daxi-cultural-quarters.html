<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/site.css"><style>
body{width:1200px;height:630px;overflow:hidden;position:relative;margin:0;background:#070709}
.hero{position:absolute;inset:0 0 0 380px;min-height:0;margin:0}.hero::after{display:none}
.og-name{position:absolute;left:72px;top:150px;font:600 156px/.86 "Instrument Sans";letter-spacing:-.055em;color:#F4F4F0;z-index:3}
.og-role{position:absolute;left:76px;top:330px;font:400 30px/1.3 "Instrument Sans";color:#B4B7BD;z-index:3}
.og-url{position:absolute;left:76px;bottom:56px;font:400 20px/1 "JetBrains Mono";color:#8A8F98;z-index:3}
.og-pill{position:absolute;left:76px;top:90px;z-index:3;font-size:18px}
.frame{position:absolute;inset:28px;border:1px solid rgba(255,255,255,.12);z-index:4;pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;top:-6px;width:11px;height:11px;background:var(--plus) center no-repeat}

.card{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:72px 72px 64px}
.card h1{font:600 54px/1 "Instrument Sans";letter-spacing:-.045em;color:#F4F4F0}
.card .k{font:400 17px/1.3 "JetBrains Mono";color:#8A8F98;margin-bottom:28px}
.card .k b{color:#E5A93C;font-weight:500}
.card .by{position:absolute;left:72px;bottom:64px;font:400 17px/1 "JetBrains Mono";color:#8A8F98}
.card .vis{align-self:center}
.card .vis img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(.92) contrast(1.06) brightness(.92);border:1px solid rgba(255,255,255,.1)}
